name: Supervise 8H Signals

on:
  # Emergency-only: daily freshness supervision is handled by
  # /api/cron/signal-8h-supervisor via cron-job.org.
  workflow_dispatch:

jobs:
  supervise_signals:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install -r engine/requirements.txt

      - name: Audit 8H Signal Freshness
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SIGNAL_8H_STALE_AFTER_HOURS: '24'
        run: |
          python engine/signal8h/supervisor.py
