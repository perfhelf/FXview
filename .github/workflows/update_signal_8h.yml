name: Update 8H Signals

on:
  schedule:
    # 3x daily: aligned with 8H candle close (UTC 00/08/16 + 30min buffer)
    - cron: '30 0 * * *'   # 8H candle close UTC 00:00 → run 00:30 → 北京 08:30
    - cron: '30 8 * * *'   # 8H candle close UTC 08:00 → run 08:30 → 北京 16:30
    - cron: '30 16 * * *'  # 8H candle close UTC 16:00 → run 16:30 → 北京 00:30
  workflow_dispatch: # Manual trigger

jobs:
  update_signals:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install -r engine/requirements.txt

      - name: Run 8H Signal Engine
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python engine/signal_8h.py
