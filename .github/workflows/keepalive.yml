name: Keepalive — Prevent Workflow Auto-Disable

# GitHub disables scheduled workflows after 60 days of repo inactivity.
# This workflow runs monthly to push an empty commit, resetting the timer.

on:
  schedule:
    - cron: '0 0 1 * *' # 每月 1 号 UTC 00:00
  workflow_dispatch: # 也可以手动触发

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Keep scheduled workflows alive
        shell: bash
        run: |
          if git log --since="50 days ago" --format=%H -n 1 | grep -q .; then
            echo "Recent commit exists; no keepalive needed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keep scheduled workflows alive"
          git push origin "HEAD:${GITHUB_REF_NAME}"
